name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Statische Prüfungen
        run: node scripts/check.js
      - name: Build-Test (lokaler Modus)
        run: node scripts/build.js
