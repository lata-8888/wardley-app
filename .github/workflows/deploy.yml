name: Deploy

# Gleicher Workflow für DEV- und PRD-Repository. Die Umgebung ergibt sich aus den
# Repository-Variablen (Settings > Secrets and variables > Actions > Variables):
#   SUPABASE_URL, SUPABASE_ANON_KEY (öffentlicher Key!), EMAIL_DOMAIN
# Voraussetzung: Settings > Pages > Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check.js

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          EMAIL_DOMAIN: ${{ vars.EMAIL_DOMAIN }}
        run: |
          echo "::notice title=Variablen::SUPABASE_URL=${#SUPABASE_URL} Zeichen, SUPABASE_ANON_KEY=${#SUPABASE_ANON_KEY} Zeichen, EMAIL_DOMAIN=${EMAIL_DOMAIN:-leer}"
          node scripts/build.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
